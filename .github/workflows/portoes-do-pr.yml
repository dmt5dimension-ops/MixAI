# Portoes que dependem das labels do PR: roda de novo sempre que labels ou commits mudam.
# - guarda-de-testes: bloqueia PR que apaga teste ou adiciona skip/only/xfail,
#   e PR que mexe em arquivo fora da secao '## Escopo' da descricao.
# - revisao-cruzada: exige feito-por:X e revisado-por:Y com X diferente de Y.
name: portoes-do-pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: portoes-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guarda-de-testes:
    name: guarda-de-testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Conferir testes apagados ou pulados
        run: python .github/scripts/guarda_testes.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
      - name: Conferir que so mudou o que foi pedido (escopo)
        if: always()
        run: python .github/scripts/trava_de_escopo.py "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  revisao-cruzada:
    name: revisao-cruzada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Novos commits invalidam a revisao anterior
        if: github.event.action == 'synchronize'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          for agente in claude codex; do
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label "revisado-por:$agente" 2>/dev/null || true
          done
          echo "REVISAO_INVALIDADA=1" >> "$GITHUB_ENV"
      - name: Conferir revisao pelo outro agente
        run: python .github/scripts/revisao_cruzada.py
